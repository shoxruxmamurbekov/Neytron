# Mahalliy ishlab chiqish uchun: PostgreSQL + backend.
# Ishga tushirish: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: neytron
      POSTGRES_PASSWORD: neytron
      POSTGRES_DB: neytron
    ports:
      - "5432:5432"
    volumes:
      - neytron-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neytron -d neytron"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://neytron:neytron@db:5432/neytron?schema=public
    ports:
      - "3000:3000"

volumes:
  neytron-db:
